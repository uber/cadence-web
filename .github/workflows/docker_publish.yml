name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Composition gate: fail-closed Open Source High/Critical on the release lockfile.
      # Dismissals live in in-repo `.snyk` (owner + expiry). Requires SNYK_TOKEN.
      - name: Snyk Open Source (fail-closed High/Critical)
        # Pinned SHA (snyk/actions master 2026-10-07): this job holds
        # SNYK_TOKEN and runs after Docker Hub login, so no floating refs.
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package-lock.json --policy-path=.snyk

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CADENCE_WEB_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CADENCE_WEB_DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push stable version to Docker Hub
        if: '!github.event.release.prerelease'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ubercadence/web:latest
            ubercadence/web:${{ github.event.release.tag_name }}

      - name: Push beta version to Docker Hub
        if: github.event.release.prerelease
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ubercadence/web:beta
            ubercadence/web:${{ github.event.release.tag_name }}

      # Container (Debian layer) scan is report-only until sibling A1 lands.
      - name: Snyk Container (report-only until A1)
        continue-on-error: true
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ubercadence/web:${{ github.event.release.tag_name }}
          args: --severity-threshold=high
